services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    ports:
      - "5000:5000"
    volumes:
      - ../src/instance:/src/instance
      - ../src/images:/src/images
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    volumes:
      - ../src/instance:/src/instance
      - ../src/images:/src/images
      - ../src/models:/src/models
    restart: unless-stopped