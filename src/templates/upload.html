<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload Order</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center min-vh-100">

    <div class="card shadow-lg p-4 w-100" style="max-width: 500px;">

        <h2 class="text-center mb-4">Upload Order</h2>

        <form action="/upload" method="POST" enctype="multipart/form-data">

            <div class="mb-3">
                <label class="form-label">Order ID</label>
                <input type="text" name="order_id" class="form-control" placeholder="Enter Order ID" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Category</label>
                <select name="category_id" class="form-select" required>
                    <option value="1">Dress</option>
                    <option value="2">Hat</option>
                    <option value="3">Longsleeve</option>
                    <option value="4">Outwear</option>
                    <option value="5">Pants</option>
                    <option value="6">Shirt</option>
                    <option value="7">Shoes</option>
                    <option value="8">Shorts</option>
                    <option value="9">Skirt</option>
                    <option value="10">T-Shirt</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Image</label>
                <input type="file" name="file" class="form-control" accept="image/*" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Upload
            </button>

        </form>

    </div>

</div>

</body>
</html>
