<!DOCTYPE html>
<html>
<head>
    <title>Returns</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h1 class="mb-4">Returns</h1>

    <table class="table table-striped table-bordered">
        <thead class="table-dark">
            <tr>
                <th>Order number</th>
                <th>Category</th>
                <th>Status</th>
            </tr>
        </thead>

        <tbody>
        {% for r in returns %}
        <tr>
            <td>{{ r["order_id"] }}</td>
            <td>{{ r["category"] }}</td>
            <td>{{ r["status"] }}</td>
        </tr>
        {% endfor %}
        </tbody>
    </table>
</div>

</body>
</html>
